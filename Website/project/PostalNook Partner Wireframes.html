<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostalNook — Partner Landing Page · Low-Fi Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2b2b;
    --line:#c9c9c9;
    --line-strong:#9a9a9a;
    --fill:#ececec;
    --fill-2:#e2e2e2;
    --paper:#f6f5f2;
    --hand:#3a6ea5;       /* annotation blue */
    --cta:#e8622a;        /* orange hint for primary CTAs */
    --cta-soft:#f6d9c8;
    --navy:#0b2545;       /* navy hint */
    --navy-soft:#c9d4e2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 31px, #e9e7e2 31px, #e9e7e2 32px),
      var(--paper);
    color:var(--ink);
    font-family:"Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Top toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:14px 26px;
    background:#16263b; color:#fff;
    border-bottom:2px solid #0b2545;
  }
  .toolbar .brand{font-weight:700; letter-spacing:.2px; font-size:15px; display:flex; align-items:center; gap:10px}
  .toolbar .brand b{color:#ff8a5c}
  .toolbar .tag{font-size:11px; opacity:.7; font-weight:500; letter-spacing:.08em; text-transform:uppercase}
  .seg{display:flex; background:#0b1b2e; border-radius:8px; padding:3px; gap:3px; margin-left:auto}
  .seg button{
    font-family:inherit; font-size:13px; font-weight:600; color:#aebccd;
    background:transparent; border:0; padding:7px 16px; border-radius:6px; cursor:pointer;
  }
  .seg button.active{background:#e8622a; color:#fff}
  .toolbar .legend{display:flex; gap:16px; align-items:center; font-size:11px; color:#aebccd; flex-wrap:wrap}
  .toolbar .legend span{display:flex; align-items:center; gap:6px}
  .sw{width:12px; height:12px; border-radius:3px; display:inline-block}
  .sw.cta{background:var(--cta)}
  .sw.navy{background:#3a6ea5}
  .sw.box{background:repeating-linear-gradient(45deg,#cfcdc7 0 5px,#e2e0da 5px 10px)}

  /* ---------- Canvas ---------- */
  .canvas{padding:40px 24px 120px; display:flex; justify-content:center}
  .stack{width:100%; max-width:1280px; display:flex; flex-direction:column; align-items:center; gap:0}
  .canvas.mobile .stack{max-width:390px}

  .frame{
    width:100%; background:#fff;
    border:2px solid var(--line-strong);
    border-bottom:0;
    position:relative;
  }
  .frame:last-of-type{border-bottom:2px solid var(--line-strong)}
  .canvas.mobile .frame{border-radius:0}

  /* section tab label on the left edge */
  .sec-tab{
    position:absolute; left:-2px; top:-2px;
    background:#16263b; color:#fff; font-size:10.5px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase;
    padding:5px 10px; z-index:3; white-space:nowrap;
  }
  .sec-num{opacity:.55; margin-right:6px}

  .pad{padding:54px 56px 44px}
  .canvas.mobile .pad{padding:46px 22px 30px}

  /* ---------- Wireframe primitives ---------- */
  .row{display:flex; gap:36px}
  .canvas.mobile .row{flex-direction:column; gap:24px}
  .col{flex:1; min-width:0}
  .center{text-align:center; align-items:center}
  .center .grp{margin-left:auto; margin-right:auto}

  .kicker{
    display:inline-block; font-size:11px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:#7a7a7a;
    border:1.5px solid var(--line-strong); border-radius:40px; padding:4px 12px; margin-bottom:16px;
  }
  .h-xl{height:30px; background:var(--fill-2); border-radius:4px; margin:0 0 12px}
  .h-lg{height:22px; background:var(--fill-2); border-radius:4px; margin:0 0 10px}
  .h-md{height:16px; background:var(--fill-2); border-radius:4px; margin:0 0 8px}
  .head{font-weight:700; font-size:23px; color:#333; margin:0 0 8px; line-height:1.2}
  .canvas.mobile .head{font-size:20px}
  .sub{font-size:13px; color:#8a8a8a; line-height:1.5; margin:0 0 8px; font-weight:400}

  .lines{display:flex; flex-direction:column; gap:7px; margin:10px 0}
  .ln{height:9px; background:var(--fill); border-radius:3px}
  .ln.w90{width:90%}.ln.w80{width:80%}.ln.w70{width:70%}.ln.w60{width:60%}.ln.w50{width:50%}.ln.w40{width:40%}.ln.w30{width:30%}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:42px; padding:0 22px; border-radius:7px; font-weight:600; font-size:13px;
    border:1.5px solid var(--line-strong); color:#555; background:#fff;
  }
  .btn.primary{background:var(--cta-soft); border-color:var(--cta); color:#b34a18}
  .btn.dark{background:var(--navy-soft); border-color:#3a6ea5; color:#1d4068}
  .btns{display:flex; gap:12px; margin-top:18px; flex-wrap:wrap}
  .canvas.mobile .btns .btn{flex:1}

  .ph{
    background:repeating-linear-gradient(45deg,#d8d6cf 0 7px,#e7e5de 7px 14px);
    border:1.5px dashed var(--line-strong); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:#6f6d66; font-size:12px; font-weight:600; letter-spacing:.03em;
    text-align:center; padding:14px;
  }
  .ph .ico{font-family:"Caveat",cursive; font-size:30px; line-height:1; margin-bottom:2px}

  .card{border:1.5px solid var(--line); border-radius:9px; padding:20px; background:#fcfcfb}
  .cards{display:grid; gap:18px}
  .cards.c2{grid-template-columns:1fr 1fr}
  .cards.c3{grid-template-columns:repeat(3,1fr)}
  .cards.c4{grid-template-columns:repeat(4,1fr)}
  .canvas.mobile .cards{grid-template-columns:1fr !important}

  .ico-box{width:40px; height:40px; border-radius:9px; background:var(--fill); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:#999; font-size:18px; margin-bottom:14px}

  .statline{display:flex; gap:0; border:1.5px solid var(--line); border-radius:10px; overflow:hidden}
  .canvas.mobile .statline{flex-direction:column}
  .stat{flex:1; padding:24px 20px; text-align:center; border-right:1.5px solid var(--line)}
  .stat:last-child{border-right:0}
  .canvas.mobile .stat{border-right:0; border-bottom:1.5px solid var(--line)}
  .canvas.mobile .stat:last-child{border-bottom:0}
  .stat .big{font-size:34px; font-weight:700; color:#3a6ea5}
  .stat .cap{font-size:11px; color:#9a9a9a; margin-top:4px}

  /* form */
  .field{height:40px; border:1.5px solid var(--line-strong); border-radius:7px; background:#fafafa; margin-bottom:12px; display:flex; align-items:center; padding:0 14px; color:#aaa; font-size:12px}
  .field.area{height:84px; align-items:flex-start; padding-top:12px}

  /* annotation */
  .annot{
    font-family:"Caveat",cursive; color:var(--hand); font-size:19px; line-height:1.15;
    display:flex; gap:8px; align-items:flex-start;
  }
  .annot::before{content:"↳"; font-family:"Space Grotesk"; font-size:14px; opacity:.7; margin-top:3px}
  .annot-row{margin-top:22px; padding-top:18px; border-top:1.5px dashed var(--navy-soft); display:flex; gap:30px; flex-wrap:wrap}
  .annot-row .annot{flex:1; min-width:200px}

  .pill-tab{display:inline-flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
  .pill{font-size:11px; border:1.5px solid var(--line); border-radius:30px; padding:5px 12px; color:#888}

  .map-wrap{position:relative; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; background:repeating-linear-gradient(45deg,#e9e7e0 0 8px,#f1efe9 8px 16px); min-height:300px}
  .canvas.mobile .map-wrap{min-height:220px}
  .pin{position:absolute; transform:translate(-50%,-100%); font-family:"Caveat",cursive; font-weight:700; font-size:14px; color:#16263b; display:flex; flex-direction:column; align-items:center}
  .pin .dot{width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); margin-top:3px}
  .pin.cur .dot{background:#3a6ea5}
  .pin.tgt .dot{background:#e8622a}
  .map-legend{position:absolute; left:14px; bottom:14px; background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:10px 12px; font-size:11px; display:flex; flex-direction:column; gap:7px; color:#666}
  .map-legend span{display:flex; align-items:center; gap:7px}

  .footnote{max-width:1280px; margin:34px auto 0; font-family:"Caveat",cursive; color:#8a8a8a; font-size:18px; text-align:center}

  .bartable{border:1.5px solid var(--line); border-radius:10px; overflow:hidden}
  .barrow{display:grid; grid-template-columns:1.4fr 1fr 1fr; border-bottom:1.5px solid var(--line)}
  .barrow:last-child{border-bottom:0}
  .barrow > div{padding:14px 16px; border-right:1.5px solid var(--line); font-size:12px; color:#777}
  .barrow > div:last-child{border-right:0}
  .barrow.hd > div{background:#f3f1ec; font-weight:600; color:#555}
  .barrow .us{color:#1d4068; font-weight:600}
  .canvas.mobile .barrow{grid-template-columns:1fr 1fr 1fr}
  .check{color:#3a8a5b; font-weight:700}
  .cross{color:#bbb}
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">📮 Postal<b>Nook</b> <span class="tag">Partner Landing · Low-Fi Wireframes</span></div>
  <div class="legend">
    <span><i class="sw cta"></i> Primary CTA</span>
    <span><i class="sw navy"></i> Data / accent</span>
    <span><i class="sw box"></i> Image placeholder</span>
  </div>
  <div class="seg" role="tablist">
    <button id="bd" class="active" onclick="setView('desktop')">Desktop</button>
    <button id="bm" onclick="setView('mobile')">Mobile</button>
  </div>
</div>

<div class="canvas desktop" id="canvas">
  <div class="stack" id="stack"></div>
</div>

<div class="footnote">Low-fidelity wireframe — grayscale boxes show structure &amp; hierarchy only. Color, type, imagery &amp; copy come in the hi-fi pass. Toggle Desktop / Mobile to preview the responsive reflow.</div>

<script>
function setView(v){
  const c=document.getElementById('canvas');
  c.className='canvas '+v;
  document.getElementById('bd').classList.toggle('active',v==='desktop');
  document.getElementById('bm').classList.toggle('active',v==='mobile');
  localStorage.setItem('wf-view',v);
  window.scrollTo({top:0});
}

/* ---- helpers ---- */
const lns=(arr)=>`<div class="lines">${arr.map(w=>`<div class="ln w${w}"></div>`).join('')}</div>`;
const ph=(label,h,ico='🖼')=>`<div class="ph" style="min-height:${h}px"><div><div class="ico">${ico}</div>${label}</div></div>`;

/* ---- sections ---- */
const sections = [
/* 0 — NAV + HERO */
`<div class="frame"><div class="sec-tab"><span class="sec-num">01</span>Nav + Hero</div><div class="pad">
  <div class="row" style="align-items:center; border-bottom:1.5px dashed var(--navy-soft); padding-bottom:14px; margin-bottom:34px">
    <div style="display:flex; align-items:center; gap:10px; font-weight:700; color:#16263b">📮 PostalNook <span style="font-size:11px; font-weight:500; color:#9a9a9a; border-left:1.5px solid var(--line); padding-left:10px">Partner Program</span></div>

  </div>
  <div class="row" style="align-items:center">
    <div class="col">
      <span class="kicker">Franchise · Partnership Opportunity</span>
      <div class="head" style="font-size:30px">Own a PostalNook in your city — a modern mailbox business [headline]</div>
      <div class="sub">One-line value prop: recurring-revenue mailbox &amp; shipping franchise, proven in Austin, ready to scale.</div>
      ${lns([90,80])}
      <div class="btns">
        <div class="btn primary">Request Partner Info →</div>
        <div class="btn dark">See the Numbers</div>
      </div>
      <div style="display:flex; gap:22px; margin-top:22px; font-size:11px; color:#9a9a9a">
        <span>★★★★★ 200+ customers</span><span>· Austin, TX proven</span><span>· Low overhead</span>
      </div>
    </div>
    <div class="col">${ph('HERO VISUAL — storefront photo / product shot or branded graphic',300,'📷')}</div>
  </div>
  <div class="annot-row">
    <div class="annot">Above the fold = promise + primary CTA. Repeat CTA in sticky nav.</div>
    <div class="annot">Trust micro-proof sits right under the buttons.</div>
  </div>
</div></div>`,

/* 1 — PROOF / STATS */
`<div class="frame"><div class="sec-tab"><span class="sec-num">02</span>Proof / Traction</div><div class="pad center">
  <span class="kicker">Proof &amp; Traction</span>
  <div class="head">The opportunity in numbers [section title]</div>
  <div class="sub" style="max-width:520px; margin:0 auto 26px">One scannable line of why this is real and growing.</div>

</div></div>`,

  <div class="row" style="align-items:center">

/* 3 — WHY THIS WORKS */
`<div class="frame"><div class="sec-tab"><span class="sec-num">04</span>Why This Works</div><div class="pad center">
  <span class="kicker">Market Drivers</span>
  <div class="head">Why this business works right now</div>
  <div class="sub" style="max-width:560px; margin:0 auto 28px">3–4 macro tailwinds: remote work, e-commerce deliveries, small-biz formation, digital nomads.</div>
  <div class="cards c4" style="text-align:left">
    ${[1,2,3,4].map(()=>`<div class="card"><div class="ico-box">📈</div><div class="h-md" style="width:70%"></div>${lns([100,80])}</div>`).join('')}

  <div class="annot-row"><div class="annot">Each driver = icon + short claim + 1 supporting stat. Builds the "why now".</div></div>
</div></div>`,

</div></div>`,

/* 5 — COMPETITIVE ADVANTAGE */
`<div class="frame"><div class="sec-tab"><span class="sec-num">06</span>Competitive Advantage</div><div class="pad">
  <div class="center"><span class="kicker">The Edge</span>
  <div class="head">Why partner with PostalNook</div>

/* 6 — INVESTMENT & SUPPORT */
`<div class="frame"><div class="sec-tab"><span class="sec-num">07</span>Investment &amp; Support</div><div class="pad">
